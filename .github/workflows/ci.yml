name: CI/CD andromeda Backend
runs-name: ${{github.actor}}'s workflow Backend
on:
  push:
    tags:
     - "v*"
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build image
        run: docker build . -t ghcr.io/${{ github.repository }}/andromeda-be:latest

      - name: Push 
        run: docker push ghcr.io/${{ github.repository }}/andromeda-be:latest

  deploy-to-server:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          port: ${{secrets.SSH_PORT}}
          key: ${{secrets.SSH_KEY}}
          script: |
            cd app
            docker compose pull backend
            docker compose up backend -d